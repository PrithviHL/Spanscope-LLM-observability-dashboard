# Local ClickHouse for Spanscope's optional STORAGE=clickhouse mode.
#
#   docker compose up -d
#   cd dashboard && STORAGE=clickhouse npm run serve
#
# Development only: the default user has no password, so the port is bound to
# localhost. Data persists in the clickhouse-data volume (docker compose down -v
# deletes it).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
