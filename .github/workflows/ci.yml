name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev

  clickhouse:
    name: Dashboard + ClickHouse
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Integration tests (ClickHouse vs in-memory parity)
        run: npx tsx --test tests/clickhouse.integration.test.ts
        env:
          CLICKHOUSE_TEST_URL: http://localhost:8123
      - name: Smoke test the server with STORAGE=clickhouse
        env:
          STORAGE: clickhouse
          SEED_SPANS: "300"
          PORT: "8099"
        run: |
          npx tsx src/index.ts --serve > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8099/healthz > /dev/null && break; sleep 1; done
          cat server.log
          # Capture responses first: "curl | grep -q" can fail under pipefail
          # when grep exits early and closes the pipe.
          health=$(curl -sf localhost:8099/healthz); echo "$health"
          grep -q '"storage":"clickhouse"' <<< "$health"
          overview=$(curl -sf "localhost:8099/api/overview?window=1h")
          grep -q '"spans":300' <<< "$overview"
          ingest=$(curl -sf -X POST localhost:8099/trace -H 'content-type: application/json' \
            -d '{"attributes":{"gen_ai.system":"openai","gen_ai.request.model":"gpt-4o-mini"}}')
          grep -q accepted <<< "$ingest"
          health=$(curl -sf localhost:8099/healthz); echo "$health"
          grep -q '"held":301' <<< "$health"

  pipeline:
    name: Pipeline (Python ${{ matrix.python }})
    # Ubuntu 24.04: GitHub ships no Python 3.9 build for ubuntu-latest (26.04),
    # and 3.9 is still the oldest version this package supports.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m unittest discover -s tests -v
      - run: python -m llm_obs

  pipeline-judges:
    name: Pipeline with DeepEval and RAGAS
    # Runs the real DeepEval and RAGAS metric code against a fake judge model,
    # so it needs no API key. Not under -W error: the libraries' own
    # dependencies emit deprecation warnings Spanscope can't fix.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[judges]"
      # Fail loudly if the extras didn't install, instead of skipping their tests.
      - run: python -c "import deepeval, ragas"
      - run: python -m unittest discover -s tests -v
