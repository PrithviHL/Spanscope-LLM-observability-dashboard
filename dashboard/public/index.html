<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spanscope · LLM observability</title>
    <meta
      name="description"
      content="Spanscope: live latency, errors and cost for LLM apps, from OpenTelemetry traces."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232a78d6'/%3E%3Cstop offset='1' stop-color='%236250d6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem("obs-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div class="aurora" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/overview" aria-label="Spanscope home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 32 32">
              <path
                class="brand-line"
                d="M4 23l7-8 6 5 11-13"
                stroke="currentColor"
                stroke-width="3.5"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="brand-name">Spanscope</span>
        </a>
        <nav class="nav" aria-label="Main">
          <span class="nav-pill" aria-hidden="true"></span>
          <a href="#/overview" data-route="overview">Overview</a>
          <a href="#/models" data-route="models">Models</a>
          <a href="#/traces" data-route="traces">Traces</a>
          <a href="#/send" data-route="send">Send data</a>
        </nav>
        <div class="topbar-right">
          <button class="cmd-btn" id="cmd-open" aria-label="Open command palette">
            <svg
              width="14"
              height="14"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
            >
              <circle cx="7" cy="7" r="4.5" />
              <path d="M10.5 10.5L14 14" stroke-linecap="round" />
            </svg>
            <span class="cmd-label">Search</span>
            <kbd id="cmd-kbd">⌘K</kbd>
          </button>
          <span class="live" id="live" title="Auto-refresh status">
            <span class="live-dot"></span><span id="live-text">Live</span>
          </span>
          <button
            class="icon-btn"
            id="pause"
            title="Pause auto-refresh"
            aria-label="Pause auto-refresh"
          >
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <rect x="3" y="2" width="3.5" height="12" rx="1" />
              <rect x="9.5" y="2" width="3.5" height="12" rx="1" />
            </svg>
          </button>
          <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">
            <svg
              width="15"
              height="15"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <circle cx="8" cy="8" r="6" />
              <path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <footer class="footer">
      <span><b>Spanscope</b> · LLM observability on OpenTelemetry</span>
      <span class="footer-links">
        <a
          href="https://github.com/PrithviHL/Spanscope-LLM-observability-dashboard"
          target="_blank"
          rel="noopener"
          >Source on GitHub</a
        >
        <span aria-hidden="true">·</span>
        <button class="linklike" id="footer-shortcuts">Keyboard shortcuts</button>
      </span>
    </footer>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title">Span</h2>
        <span style="flex: 1"></span>
        <button class="icon-btn" id="drawer-close" aria-label="Close">
          <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.8">
            <path d="M1 1l10 10M11 1L1 11" />
          </svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <div class="palette-backdrop" id="palette-backdrop"></div>
    <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-input">
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        >
          <circle cx="7" cy="7" r="4.5" />
          <path d="M10.5 10.5L14 14" stroke-linecap="round" />
        </svg>
        <input
          id="palette-input"
          type="text"
          placeholder="Type a command, or search traces by ID or model…"
          autocomplete="off"
          spellcheck="false"
          aria-controls="palette-list"
        />
        <kbd>esc</kbd>
      </div>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>↵</kbd> run</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
